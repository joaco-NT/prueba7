<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Git y Ramas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            border: 2px solid #3b82f6;
        }
        h1 {
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
        }
        .badge {
            background-color: #3b82f6;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Mi Primer Proyecto Git!</h1>
        <p>Si ves este mensaje, el archivo HTML está funcionando correctamente.</p>
        <div class="badge">Versión: Rama Principal (main)</div>
    </div>

</body>
</html>
